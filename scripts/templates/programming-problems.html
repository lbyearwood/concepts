<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="GCSE programming exam questions and step-by-step Python tutorials.">
  <title>Programming Problems | CSRevision</title>
  <link rel="stylesheet" href="../../../assets/sidebar.css?v=tutorials-1">
  <link rel="stylesheet" href="../../../assets/colour-block.css?v=2">
  <link rel="stylesheet" href="../../../assets/programming-problems.css?v=13">
  <script src="../../../assets/tutorial-code-style.js?v=2" defer></script>
  <script src="../../../assets/tutorial-typing-sound.js?v=4" defer></script>
  <script src="../../../assets/tutorial-fit.js?v=3" defer></script>
  <script src="../../../assets/tutorial-typewriter.js?v=6" defer></script>
  <script src="../../../assets/tutorial-tutor.js?v=8" defer></script>
  <script src="../../../assets/programming-problems.js?v=15" defer></script>
</head>
<body class="has-sidebar theme-colour-block problems-page">
  <a class="skip-link" href="#main-content">Skip to content</a>
__SIDEBAR__
  <main id="main-content" class="problems-app" tabindex="-1">
    <header class="problems-heading">
      <p class="eyebrow">GCSE Computer Science / Tutorials</p>
      <h1>Programming problems</h1>
    </header>
    <div class="problem-collections" role="tablist" aria-label="Problem collections">
      <button id="collection-exam" type="button" role="tab" aria-selected="true" aria-controls="problem-panel" data-collection="exam">Exam questions</button>
      <button id="collection-level1" type="button" role="tab" aria-selected="false" aria-controls="problem-panel" data-collection="level1" tabindex="-1">Easy</button>
      <button id="collection-level2" type="button" role="tab" aria-selected="false" aria-controls="problem-panel" data-collection="level2" tabindex="-1">Medium</button>
      <button id="collection-level3" type="button" role="tab" aria-selected="false" aria-controls="problem-panel" data-collection="level3" tabindex="-1">Hard</button>
    </div>
    <section id="problem-panel" class="problem-panel" role="tabpanel" aria-labelledby="collection-exam">
      <div class="problem-categories" role="tablist" aria-label="Exam question categories">
__CATEGORIES__
      </div>
      <div class="practice-categories" role="tablist" aria-label="Console problem categories" hidden>
__PRACTICE_CATEGORIES__
      </div>
      <section id="category-panel" class="category-panel" role="tabpanel" aria-labelledby="category-traversal">
        <div class="problem-list-heading">
          <h2 id="problem-category-title">List Traversal</h2>
          <span class="problem-list-instruction">Choose a problem to open its exam question</span>
        </div>
        <p class="practice-console-note" hidden>Use text input and output in the console.</p>
        <div class="problem-list-scroll">
          <ol class="problem-list" aria-label="List Traversal problems">
__PROBLEM_LIST__
          </ol>
          <p class="problem-empty" hidden></p>
          <noscript><p>Enable JavaScript to open the questions and change categories.</p></noscript>
        </div>
      </section>
    </section>
    <p class="sr-only problem-announcement" aria-live="polite"></p>
  </main>
  <dialog id="tutorial-modal" class="tutorial-modal" aria-labelledby="tutorial-title">
    <header class="tutorial-header">
      <div class="tutorial-heading"><p class="tutorial-path"></p><h2 id="tutorial-title"></h2></div>
      <div class="tutorial-header-actions">
        <nav class="tutorial-problem-nav" aria-label="Problems in this category">
          <button class="tutorial-problem-previous" data-problem-direction="-1" type="button" aria-label="Previous problem in this category"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M15 5l-7 7 7 7"/></svg></button>
          <button class="tutorial-problem-next" data-problem-direction="1" type="button" aria-label="Next problem in this category"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9 5l7 7-7 7"/></svg></button>
        </nav>
        <button class="tutorial-close" type="button" autofocus>Close</button>
      </div>
    </header>
    <div class="tutorial-body">
      <details class="tutorial-question" open>
        <summary>Exam question</summary>
        <div class="tutorial-question-content"></div>
      </details>
      <details class="tutorial-help">
        <summary>Tutorial</summary>
        <div class="tutorial-help-content">
          <section class="tutorial-walkthrough" aria-label="Code walkthrough">
            <div class="tutorial-stage-row">
              <div class="tutorial-steps" role="group" aria-label="Tutorial steps"></div>
            </div>
            <h3 class="tutorial-step-title"></h3>
            <div class="tutorial-step-content"></div>
          </section>
          <aside class="tutorial-tutor" aria-label="Line-by-line tutor" hidden></aside>
        </div>
      </details>
    </div>
    <footer class="tutorial-footer" hidden>
      <span class="tutorial-counter"></span>
      <button class="typing-sound-toggle" type="button" aria-label="Mute all sound effects" aria-pressed="true" title="Typing and answer sounds on" hidden>
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M3 9h4l5-4v14l-5-4H3zM16 8c3 2 3 6 0 8M19 5c5 4 5 10 0 14"/><path class="sound-slash" d="M3 2l18 20"/></svg>
        <span class="typing-sound-label">Sound on</span>
      </button>
      <div><button class="tutorial-back" type="button"><span class="problem-icon icon-left" aria-hidden="true"></span>Back</button><button class="tutorial-next" type="button"><span data-next-label>Next</span><span class="problem-icon icon-right" aria-hidden="true"></span></button></div>
    </footer>
    <p class="sr-only tutorial-announcement" aria-live="polite"></p>
  </dialog>
  <script type="application/json" id="problem-data">__PROBLEM_DATA__</script>
  <script type="application/json" id="tutorial-guide-data">__TUTOR_GUIDE_DATA__</script>
</body>
</html>
