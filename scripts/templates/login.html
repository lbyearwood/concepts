<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Sign in to CSRevision.">
  <meta name="robots" content="noindex">
  <title>Sign in | CSRevision</title>
  <link rel="stylesheet" href="assets/colour-block.css?v=2">
  <link rel="stylesheet" href="assets/homepage.css?v=2">
  <link rel="stylesheet" href="assets/login.css?v=1">
  <script src="assets/login-preview.js?v=1" defer></script>
</head>
<body class="theme-colour-block login-page">
  <a class="home-skip" href="#login-main">Skip to sign in</a>
  <header class="home-header">
    <div class="home-container home-header-inner">
      <a class="home-brand" href="index.html" aria-label="CSRevision home"><img src="assets/csrevision-logo.png" width="545" height="325" alt="CSR — csrevision"></a>
      <div class="home-header-actions">
        <a class="home-button home-header-revise" href="courses/gcse-computer-science/index.html">Start revising</a>
        <a class="home-account" href="login.html" aria-label="Sign in" title="Sign in" aria-current="page"><img src="assets/icons/person-circle.svg" width="34" height="34" alt=""></a>
      </div>
    </div>
  </header>
  <main id="login-main" class="login-shell" tabindex="-1">
    <section class="login-layout" aria-labelledby="login-title">
      <aside class="login-welcome" aria-label="About CSRevision">
        <svg class="login-brand-icon" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="assets/icons/problem-categories.svg#computing"></use></svg>
        <p class="login-tagline"><span>Make</span> <span>Computer</span> <span>Science</span> <span class="login-highlight">click.</span></p>
        <p class="login-brand-copy">Clear explanations, guided programming tutorials and GCSE practice.</p>
      </aside>
      <div class="login-form-panel">
        <h1 id="login-title">Sign in</h1>
        <form id="login-form" action="login.html" method="get" novalidate>
          <fieldset class="login-fields" disabled>
            <legend class="login-sr-only">Sign-in details</legend>
            <div class="login-field">
              <label for="login-email">Email address</label>
              <input id="login-email" type="email" inputmode="email" autocomplete="off" spellcheck="false" autocapitalize="none" placeholder="name@example.com">
            </div>
            <div class="login-field">
              <label for="login-password">Password</label>
              <div class="login-password-field">
                <input id="login-password" type="password" autocomplete="off">
                <button class="password-toggle" type="button" aria-label="Show password" aria-pressed="false" aria-controls="login-password"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/><path class="password-slash" d="m3 3 18 18"/></svg></button>
              </div>
            </div>
            <button class="login-submit" type="submit">Sign in</button>
          </fieldset>
          <p class="login-error" id="login-error" role="alert" tabindex="-1" hidden>Sign-in is not available yet.</p>
          <noscript><p class="login-error">Sign-in is not available yet.</p></noscript>
        </form>
        <a class="login-continue" href="courses/gcse-computer-science/index.html">Continue without signing in</a>
      </div>
    </section>
  </main>
  <footer class="login-footer"><p>© 2026 CSRevision</p></footer>
</body>
</html>
