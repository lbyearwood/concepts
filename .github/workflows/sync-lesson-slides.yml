name: Synchronise lesson slides and publish CSRevision

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: csrevision-pages
  cancel-in-progress: false

jobs:
  sync-and-publish:
    # The user requires no additional running costs. Standard hosted compute is
    # free for this public repository; stop if its visibility changes.
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out website
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install slide-rendering tools
        run: python -m pip install -r scripts/requirements-slides.txt

      - name: Verify conversion and publisher failure handling
        run: |
          python -m unittest discover -s tests -p 'test_slide_sync.py'
          node --test tests/slide-sync.test.cjs
          node --test tests/slide-mirror.test.cjs
          python scripts/build-course.py --check
          python scripts/build-problems.py --check

      - name: Render approved PDF supplied by Google Apps Script
        run: python scripts/sync-slides.py

      - name: Save successful slide updates back to the repository
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "A newer main revision is queued. Refusing to publish stale content."
            exit 1
          fi
          git add assets/slide-decks/
          if ! git diff --cached --quiet; then
            git commit -m "Sync published student slides [skip ci]"
            git push origin HEAD:main
          else
            echo "Slides unchanged; no commit needed."
          fi

      - name: Record the packaged revision
        shell: bash
        run: |
          git rev-parse HEAD > assets/site-revision.txt
          echo "Packaged revision: $(cat assets/site-revision.txt)" >> "$GITHUB_STEP_SUMMARY"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Package website for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
          retention-days: 1

      - name: Deploy website, including updated slides
        id: deployment
        uses: actions/deploy-pages@v4
