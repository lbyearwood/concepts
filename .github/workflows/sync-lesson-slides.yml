name: Synchronise lesson slides and publish CSRevision

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: csrevision-pages
  cancel-in-progress: false

jobs:
  sync-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out website
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install slide-rendering tools
        run: python -m pip install "pymupdf>=1.24,<2" "pillow>=11,<13"

      - name: Render approved PDF supplied by Google Apps Script
        run: python scripts/sync-slides.py

      - name: Save successful slide updates back to the repository
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/slide-decks/
          if ! git diff --cached --quiet; then
            git commit -m "Sync published student slides [skip ci]"
            git push origin HEAD:main
          else
            echo "Slides unchanged; no commit needed."
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Package website for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy website, including updated slides
        id: deployment
        uses: actions/deploy-pages@v4
